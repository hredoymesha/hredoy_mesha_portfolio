[project]
name = "citecraft-local"
version = "0.1.0"
description = "Local-first academic citation generator for the portfolio"
requires-python = ">=3.12,<3.15"
dependencies = [
  "citeproc-py==0.11.1",
  "bibtexparser==1.4.3",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "python-docx>=1.1,<2",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "hypothesis>=6.120,<7",
  "mypy>=1.14,<2",
  "pytest>=8.3,<10",
  "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["citecraft"]
ignore_missing_imports = true
